# Default values for nlweb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: iunera/nlweb
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

env:
  - name: PYTHONPATH
    value: "/app"
  - name: PORT
    value: "8000"
  - name: NLWEB_LOGGING_PROFILE
    value: production

envFrom: {}

extraArgs: []

hostAliases: []

volumes:
  enabled: true
  emptyDirs:
    - name: data
      mountPath: /data
    - name: tmp
      mountPath: /tmp

  pvc:
    enabled: false

  # ConfigMap section for NLweb settings - See example with the config_webserver.yaml
  configMaps: []
  #    - name: nlweb-config
  #      mountPath: /app/config
  #      data:
  #        config_webserver.yaml: |-
  #          port: 8000
  #          static_directory: ../../
  #          mode: production
  #
  #          server:
  #            host: 0.0.0.0
  #            enable_cors: true
  #            cors_trusted_origins: "*"
  #            max_connections: 100
  #            timeout: 30
  #
  #            ssl:
  #              enabled: false
  #              cert_file_env: SSL_CERT_FILE
  #              key_file_env: SSL_KEY_FILE
  #
  #            logging:
  #              level: info
  #              file: ./logs/webserver.log
  #
  #            static:
  #              enable_cache: true
  #              cache_max_age: 3600
  #              gzip_enabled: true

  existingConfigMaps: []
  existingSecrets: []

livenessProbe:
  httpGet:
    path: /
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

# requires emptyDir for the path /tmp with springboot when readOnlyRootFilesystem:true
securityContext:
  capabilities:
    drop:
      - ALL
    add: []
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 999

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}
#  limits:
#    cpu: 1000m
#    memory: 2Gi
#  requests:
#    cpu: 200m
#    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
