apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wordpress.fullname" . }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "wordpress.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "wordpress.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wordpress.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.customFunctionsPhp .Values.initContainers }}
      initContainers:
        {{- if .Values.customFunctionsPhp }}
        - name: ensure-custom-functions
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              TARGET="{{ .Values.customFunctionsTarget | default "/var/www/html/wp-content/themes/colibri-wp/functions.php" }}"
              if [ -f "$TARGET" ]; then
                if ! grep -q "CUSTOM IUNERA CODING START" "$TARGET"; then
                  echo "Custom functions missing in $TARGET. Appending..."
                  printf "\n" >> "$TARGET"
                  cat /tmp/custom-functions.php >> "$TARGET"
                  chown www-data:www-data "$TARGET" || true
                  echo "Successfully appended custom functions to $TARGET."
                else
                  echo "Custom functions already present in $TARGET."
                fi
              else
                echo "Target file $TARGET does not exist yet, skipping."
              fi
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
            - name: customuploadsini
              mountPath: /tmp/custom-functions.php
              subPath: custom-functions.php
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
            - name: customuploadsini
              mountPath: /usr/local/etc/php/conf.d/uploads.ini
              subPath: uploads.ini
          env:
            - name: WORDPRESS_DB_HOST
              value: {{ include "wordpress.databaseHost" . | quote }}
            - name: WORDPRESS_DB_PORT
              value: {{ include "wordpress.databasePort" . | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ include "wordpress.databaseUser" . | quote }}
            - name: WORDPRESS_DB_NAME
              value: {{ include "wordpress.databaseName" . | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.databaseSecretName" . }}
                  key: mariadb-password
            {{- with .Values.extraEnv }}
{{ toYaml . | indent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: http

          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: customuploadsini
          configMap:
            name: {{ template "wordpress.fullname" . }}-customuploadsini
        - name: wordpress-data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "wordpress.fullname" .) }}
        {{- else }}
          emptyDir: {}
        {{- end -}}
